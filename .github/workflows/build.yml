name: Build

# The Orange Beam app (overlays, menu bar, panel) uses AppKit and is built for
# macOS on Apple Silicon only. The diagnostics CLI (list, probe, inspect,
# capture, watch-controls, vibrate, ...) depends only on hidapi and is also
# built for Linux and Windows. Pushing a v* tag publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Offscreen rendering checks
        run: cargo run --locked -- render-fixtures "$RUNNER_TEMP/render-qa"
      - name: Bundle (ad-hoc signed, not notarized)
        run: sh scripts/bundle.sh "$RUNNER_TEMP/dist"
      - name: Zip
        run: ditto -c -k --keepParent "$RUNNER_TEMP/dist/Orange Beam.app" Orange-Beam-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Orange-Beam-macos-arm64
          path: Orange-Beam-macos-arm64.zip
          if-no-files-found: error

  cli:
    name: Diagnostics CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install hidapi build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=orange-beam-cli-${{ matrix.name }}
          mkdir "$dir"
          cp target/release/orange-beam LICENSE NOTICE THIRD-PARTY-LICENSES.txt "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "orange-beam-cli-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/orange-beam.exe, LICENSE, NOTICE, THIRD-PARTY-LICENSES.txt $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: orange-beam-cli-${{ matrix.name }}
          path: orange-beam-cli-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
