[package]
name = "spotlight-rs"
version = "0.2.0"
edition = "2021"
description = "Native macOS presentation effects and Logitech Spotlight diagnostics"
license = "MIT"
publish = false

[dependencies]
hidapi = "2.6.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSPanel", "NSView", "NSScreen", "NSEvent", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSCell", "NSButtonCell", "NSColor", "NSBezierPath", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSAlert", "NSTextField", "NSText", "NSFont", "NSRunningApplication", "NSWorkspace", "NSPopUpButton", "NSStackView", "NSLayoutConstraint", "NSLayoutAnchor", "NSSlider", "NSSliderCell", "NSBox", "NSUserInterfaceLayout", "libc", "objc2-core-foundation", "objc2-core-graphics", "block2"] }
objc2-core-graphics = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-image = "0.3.2"
dispatch2 = "0.3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
